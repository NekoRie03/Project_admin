<body>
    <nav class="navbar">
        <div class="navbar-brand">Guard Dashboard</div>
        <div class="navbar-right">
            <a href="{% url 'guard_dashboard' %}">Report Violation</a>
            <a href="{% url 'guard_change_password' %}">Change Password</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </nav>
    <!-- Change Password Card -->
    <div class="password-card">
        <h2 class="card-title">Change Password</h2>
        
        <div class="error-message" id="errorMessage"></div>

        <form id="changePasswordForm" method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label" for="currentPassword">Current Password</label>
                <input type="password" class="form-input" id="currentPassword" name="old_password" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="newPassword">New Password</label>
                <input type="password" class="form-input" id="newPassword" name="new_password1" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm New Password</label>
                <input type="password" class="form-input" id="confirmPassword" name="new_password2" required>
            </div>

            <button type="submit" class="submit-button">Change Password</button>
        </form>
    </div>
</div>
</div>

<script>
document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorMessage = document.getElementById('errorMessage');

    if (newPassword !== confirmPassword) {
        e.preventDefault();
        errorMessage.textContent = 'New passwords do not match';
        errorMessage.style.display = 'block';
        return;
    }

    // Show Django messages if they exist
    {% if messages %}
        {% for message in messages %}
            errorMessage.textContent = '{{ message }}';
            errorMessage.style.display = 'block';
        {% endfor %}
    {% endif %}
});
</script>
</body>
