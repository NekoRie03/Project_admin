<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Guard Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/guard.css' %}">
    <style>
        
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #818cf8;
            --background-color: #f3f4f6;
            --card-background: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            line-height: 1.5;
        }

        .navbar {
            background-color: var(--card-background);
            padding: 1rem 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .navbar-brand {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        .navbar-right {
            display: flex;
            gap: 1rem;
        }

        .navbar a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }

        .navbar a:hover {
            background-color: var(--background-color);
            color: var(--primary-color);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        .student-profile {
            background-color: var(--card-background);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 1rem;
            object-fit: cover;
            margin: 0 auto 1rem;
            display: block;
            border: 4px solid var(--secondary-color);
        }

        .student-name {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .info-item {
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--background-color);
        }

        .info-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .info-value {
            font-weight: 500;
            color: var(--text-primary);
        }

        .violations-card {
            background-color: var(--card-background);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .violations-count {
            background-color: var(--primary-color);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.875rem;
        }

        .violations-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .violations-table th {
            background-color: var(--background-color);
            padding: 1rem;
            text-align: left;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--secondary-color);
        }

        .violations-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--background-color);
        }

        .severity-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.875rem;
            background-color: #fee2e2;
            color: #991b1b;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">Guard Dashboard</div>
        <div class="navbar-right">
            <a href="{% url 'guard_dashboard' %}">Report Violation</a>
            <a href="{% url 'guard_change_password' %}">Change Password</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </nav>


    <div class="container">
        <h1>Welcome, {{ request.user.get_full_name }}</h1>

        <form method="GET" class="search-form">
            <input type="text" name="student_search" placeholder="Search student name..." 
                   value="{{ request.GET.student_search }}">
            <button type="submit">Search</button>
        </form>
        
        <form method="POST">
            {% csrf_token %}
            <label for="student">Select Student:</label>
            <select name="student_id" required>
                {% for student in students %}
                <option value="{{ student.id }}">{{ student.get_full_name }}</option>
                {% endfor %}
            </select>
        
            <label for="violation">Select Violation:</label>
            <select name="violation_id" required>
                {% for violation in violations %}
                <option value="{{ violation.id }}">{{ violation.name }}</option>
                {% endfor %}
            </select>
        
            <button type="submit">Record Violation</button>
        </form>
        
        {% if message %}
        <p>{{ message }}</p>
        {% endif %}
    </div>
</body>
</html>
